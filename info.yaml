# Tiny Tapeout project information
project:
  title:        "TT TPU — 2x2 INT4 Systolic Array AI Accelerator"
  author:       "tt-tpu-agent"
  discord:      ""
  description:  "Serial-I/O 2x2 INT4 weight-stationary systolic array MAC engine with 12-bit saturating accumulation (C = A x W, multi-tile K chaining)"
  language:     "Verilog"
  clock_hz:     20000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tpu_accelerator"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_tpu_accelerator.v"
    - "pe.v"
    - "systolic_array.v"
    - "control_fsm.v"
    - "io_serializer.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs — ui[7:6]=OP opcode, ui[5:4]=WADDR, ui[5]=ACC, ui[3:0]=DATA nibble
  ui[0]: "DATA0"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "WADDR0"
  ui[5]: "WADDR1"
  ui[6]: "OP0"
  ui[7]: "OP1"

  # Outputs — uo[0]=RBIT serial result, uo[4:1]=BCNT, uo[5]=DONE, uo[6]=BUSY, uo[7]=RDV
  uo[0]: "RBIT"
  uo[1]: "BCNT0"
  uo[2]: "BCNT1"
  uo[3]: "BCNT2"
  uo[4]: "BCNT3"
  uo[5]: "DONE"
  uo[6]: "BUSY"
  uo[7]: "RDV"

  # Bidirectional pins — live debug bus: FSM state, queue level, strobes
  uio[0]: "CSTB"
  uio[1]: "WSTB"
  uio[2]: "QC0"
  uio[3]: "QC1"
  uio[4]: "ACC"
  uio[5]: "RV"
  uio[6]: "ST0"
  uio[7]: "ST1"

# Do not change!
yaml_version: 6
